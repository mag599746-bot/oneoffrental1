<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ONEOFF | Gallery Detail</title>
  <meta name="description" content="ONEOFF LED 렌탈 갤러리 상세 페이지. 제품/사례 상세 정보와 이미지를 확인하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple-950: #0b1e5b;
      --purple-900: #0b1e5b;
      --purple-800: #14318a;
      --purple-700: #1d4ed8;
      --purple-600: #2563eb;
      --purple-500: #3b82f6;
      --yellow-500: #1d4ed8;
      --yellow-400: #60a5fa;
      --yellow-300: #bfdbfe;
      --ink: #0f172a;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      --shadow-soft: 0 16px 34px rgba(15, 23, 42, 0.14);
      --font-display: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      --font-body: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 20% -10%, rgba(29, 78, 216, 0.14), transparent 60%),
        radial-gradient(700px 360px at 90% 10%, rgba(59, 130, 246, 0.12), transparent 60%),
        linear-gradient(180deg, #eef4ff 0%, #ffffff 100%);
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1100px, 100% - 48px);
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 30, 91, 0.98);
      border-bottom: 2px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      color: #fff;
    }

    .header__inner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      flex-wrap: wrap;
    }

    .logo img {
      width: 150px;
      height: auto;
      display: block;
    }

    .header__actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.18);
    }

    .page {
      padding: 56px 0 86px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 12px;
      color: var(--yellow-400);
      margin: 0;
    }

    .hero {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      margin-bottom: 26px;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(34px, 4vw, 56px);
      margin: 0;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .hero p {
      margin: 0;
      max-width: 72ch;
      color: rgba(15, 23, 42, 0.65);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: #fff;
      border: 1px solid rgba(29, 78, 216, 0.18);
      border-radius: 22px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .media {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .media__main {
      width: 100%;
      height: min(520px, 58vh);
      object-fit: contain;
      background: #f1f5ff;
      border-radius: 16px;
      border: 1px solid rgba(29, 78, 216, 0.16);
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .thumb {
      border: 1px solid rgba(29, 78, 216, 0.18);
      border-radius: 14px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .thumb:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(29, 78, 216, 0.16);
    }

    .thumb img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      background: #f1f5ff;
      border-radius: 10px;
      display: block;
    }

    .thumb span {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(15, 23, 42, 0.7);
    }

    .meta {
      padding: 18px 18px 8px;
    }

    .meta h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.02em;
    }

    .meta dl {
      margin: 14px 0 0;
      display: grid;
      gap: 10px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(29, 78, 216, 0.14);
      background: rgba(29, 78, 216, 0.05);
    }

    .meta dt {
      font-weight: 900;
      color: rgba(15, 23, 42, 0.72);
      font-size: 13px;
    }

    .meta dd {
      margin: 0;
      font-weight: 700;
      color: rgba(15, 23, 42, 0.86);
      word-break: keep-all;
    }

    .note {
      padding: 0 18px 18px;
      color: rgba(15, 23, 42, 0.55);
      font-size: 13px;
      margin: 0;
    }

    .error {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(239, 68, 68, 0.22);
      background: rgba(239, 68, 68, 0.06);
      color: rgba(127, 29, 29, 0.92);
      font-weight: 700;
    }

  <script>
    const titleEl = document.querySelector("[data-detail-title]");
    const categoryEl = document.querySelector("[data-detail-category]");
    const descEl = document.querySelector("[data-detail-desc]");
    const layoutEl = document.querySelector("[data-detail-layout]");
    const errorEl = document.querySelector("[data-detail-error]");
    const mainImgEl = document.querySelector("[data-detail-main]");
    const thumbsEl = document.querySelector("[data-detail-thumbs]");
    const inlineDataTag = document.getElementById("gallery-inline-data");

    const fields = {
      date: document.querySelector('[data-field="date"]'),
      location: document.querySelector('[data-field="location"]'),
      organizer: document.querySelector('[data-field="organizer"]'),
      host: document.querySelector('[data-field="host"]'),
      items: document.querySelector('[data-field="items"]')
    };

    const parseCsv = (text) => {
      const rows = [];
      let current = "";
      let inQuotes = false;
      let row = [];

      const pushCell = () => {
        row.push(current);
        current = "";
      };

      const pushRow = () => {
        if (row.length > 0) {
          rows.push(row);
        }
        row = [];
      };

      const normalized = String(text || "").replace(/^\uFEFF/, "");

      for (let i = 0; i < normalized.length; i += 1) {
        const char = normalized[i];
        if (char === '"') {
          if (inQuotes && normalized[i + 1] === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          pushCell();
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && normalized[i + 1] === "\n") {
            i += 1;
          }
          pushCell();
          pushRow();
        } else {
          current += char;
        }
      }

      if (current.length || row.length) {
        pushCell();
        pushRow();
      }

      const [headers, ...data] = rows;
      if (!headers) {
        return [];
      }

      return data.map((values) => {
        const entry = {};
        headers.forEach((header, index) => {
          entry[String(header || "").trim()] = String(values[index] || "").trim();
        });
        return entry;
      });
    };

    const getInlineCsv = () => (inlineDataTag ? inlineDataTag.textContent.trim() : "");

    const loadCsv = async () => {
      const inlineCsv = getInlineCsv();
      try {
        const response = await fetch("gallery-data.csv", { cache: "no-store" });
        if (response.ok) {
          return { text: await response.text(), source: "file" };
        }
      } catch (error) {
        console.warn("CSV fetch failed, using inline data.", error);
      }
      if (inlineCsv) {
        return { text: inlineCsv, source: "inline" };
      }
      throw new Error("CSV load failed");
    };

    const setError = (message) => {
      layoutEl.hidden = true;
      errorEl.hidden = false;
      errorEl.textContent = message;
    };

    const setMeta = (row) => {
      fields.date.textContent = row.date || "-";
      fields.location.textContent = row.location || "-";
      fields.organizer.textContent = row.organizer || "-";
      fields.host.textContent = row.host || "-";
      fields.items.textContent = row.items || "-";
    };

    const renderThumbs = (images) => {
      thumbsEl.innerHTML = "";
      images.forEach((src, idx) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "thumb";
        button.innerHTML = `
          <img alt="샘플 이미지 ${idx + 1}" />
          <span>샘플 ${idx + 1}</span>
        `;
        const img = button.querySelector("img");
        img.src = src;
        button.addEventListener("click", () => {
          mainImgEl.src = src;
        });
        thumbsEl.appendChild(button);
      });
    };

    const detailImages = {
      "infodesk-1000-1000-2000": [
        "assets/infodesk-1000-1000-2000-1.png",
        "assets/infodesk-1000-1000-2000-2.png",
        "assets/infodesk-1000-1000-2000-3.png"
      ]
    };

    const init = async () => {
      const params = new URLSearchParams(window.location.search);
      const detailKey = (params.get("detail") || "").trim();
      if (!detailKey) {
        setError("상세 페이지 ID(detail)가 없습니다. 갤러리에서 다시 선택해 주세요.");
        return;
      }

      const result = await loadCsv();
      const rows = parseCsv(result.text);
      const row = rows.find((r) => (r.detail || "").trim() === detailKey);
      if (!row) {
        setError(`해당 상세 항목을 찾지 못했습니다: ${detailKey}`);
        return;
      }

      const images = detailImages[detailKey] || (row.image ? [row.image] : []);
      const normalizedImages = images.filter(Boolean).slice(0, 3);
      if (!normalizedImages.length) {
        setError("이미지 정보를 찾지 못했습니다. CSV의 image/detail 값을 확인해 주세요.");
        return;
      }

      categoryEl.textContent = row.category || "GALLERY DETAIL";
      titleEl.textContent = row.event || "상세 페이지";
      descEl.textContent = row.items ? `렌탈물품: ${row.items}` : "선택한 항목의 상세 정보와 샘플 이미지를 확인하세요.";
      setMeta(row);

      mainImgEl.src = normalizedImages[0];
      mainImgEl.alt = row.event || "상세 이미지";
      renderThumbs(normalizedImages);

      errorEl.hidden = true;
      layoutEl.hidden = false;
    };

    init().catch(() => {
      setError("상세 데이터를 불러오지 못했습니다. gallery-data.csv 또는 내장 데이터를 확인해 주세요.");
    });
  </script>
